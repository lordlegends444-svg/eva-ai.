<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EVA – moje AI</title><style>body{font:17px system-ui;background:#101727;color:white;margin:0;padding:20px}main{max-width:650px;margin:auto}h1{color:#8ed8ff}#chat{height:48vh;overflow:auto;background:#1d2940;border-radius:15px;padding:15px}.msg{margin:12px 0;padding:10px;background:#31415c;border-radius:12px}button,input,textarea{font:inherit;border:0;border-radius:12px;padding:12px;margin:5px 0}button{background:#8ed8ff;color:#101727}textarea{width:95%}small{color:#b9c6d7}</style><main><h1>✨ EVA</h1><p>Česká hlasová asistentka – zkušební rozhraní</p><div id="chat"><div class="msg">Ahoj! Jsem EVA. Zatím jsem ukázka ovládání bez připojeného AI modelu.</div></div><textarea id="input" placeholder="Napiš, co potřebuješ..."></textarea><br><button onclick="send()">Odeslat</button> <button onclick="listen()">🎤 Mluvit</button><br><label>📷 Přidat fotku <input type="file" id="photo" accept="image/*"></label><p id="file"></p><small>Pro skutečné odpovědi, úpravy fotek a generování videa bude potřeba připojit AI služby. Mikrofon funguje jen v podporovaném prohlížeči a bezpečném webovém prostředí.</small></main><script>const chat=document.querySelector('#chat'),input=document.querySelector('#input');function add(t){let d=document.createElement('div');d.className='msg';d.textContent=t;chat.append(d);chat.scrollTop=chat.scrollHeight}function send(){let t=input.value.trim();if(!t)return;add('Ty: '+t);input.value='';add('EVA: Příkaz jsem přijala. Abych ho mohla skutečně provést, musíme připojit AI model a příslušné nástroje.')}function listen(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){add('Rozpoznávání řeči není v tomto prohlížeči dostupné.');return}let r=new R();r.lang='cs-CZ';r.onresult=e=>{input.value=e.results[0][0].transcript;send()};r.onerror=e=>add('Mikrofon: '+e.error);r.start()}document.querySelector('#photo').onchange=e=>{let f=e.target.files[0];if(f)document.querySelector('#file').textContent='Vybraná fotka: '+f.name};</script></html>
